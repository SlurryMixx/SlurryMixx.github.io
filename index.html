<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOCTURNE</title>
<style>
  :root{
    --navy-deep:#0a1220;
    --navy:#0e1a30;
    --navy-light:#16264a;
    --steel:#c9cdd3;
    --steel-dark:#9a9fa8;
    --steel-shadow:#5c616b;
    --amber:#f2a93c;
    --ink:#e9ebef;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--navy-deep);
    color:var(--ink);
    font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
    overflow-x:hidden;
  }

  .stage{
    position:relative;
    min-height:100vh;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 90% 70% at 68% 15%, #1c2c52 0%, transparent 60%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    min-height:100vh;
    overflow:hidden;
  }
  .hero video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }
  .hero .scrim{
    position:absolute;
    inset:0;
    z-index:1;
    background:
      linear-gradient(180deg, rgba(10,18,32,.15) 0%, rgba(10,18,32,.65) 78%, rgba(10,18,32,.9) 100%),
      linear-gradient(90deg, rgba(10,18,32,.55) 0%, rgba(10,18,32,0) 40%);
  }
  .hero-copy{
    position:absolute;
    left:calc(min(30vw,340px) + 6vw);
    bottom:9vh;
    z-index:3;
    max-width:520px;
  }
  .eyebrow{
    font-family:"Courier New",monospace;
    letter-spacing:.28em;
    font-size:.72rem;
    color:var(--amber);
    margin:0 0 14px;
  }
  .hero-copy h1{
    font-size:clamp(2.6rem,6.5vw,4.6rem);
    line-height:.94;
    margin:0 0 18px;
    font-weight:600;
    letter-spacing:-.01em;
  }
  .hero-copy p{
    font-size:1.05rem;
    line-height:1.55;
    color:#b7bdca;
    margin:0 0 28px;
    max-width:44ch;
  }
  .hero-cta{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 26px;
    background:var(--amber);
    color:#241705;
    font-weight:700;
    font-size:.95rem;
    border-radius:2px;
    text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .hero-cta:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(242,169,60,.25);}
  .hero-cta:focus-visible{outline:2px solid var(--ink); outline-offset:3px;}

  /* ---------- NAV DEVICE ---------- */
  .device{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    width:min(30vw,340px);
    min-width:250px;
    z-index:5;
    padding:0;
    background:linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.04) 40%, rgba(255,255,255,.1));
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    border-right:1px solid rgba(255,255,255,.35);
    box-shadow:
      inset 1px 1px 0 rgba(255,255,255,.5),
      inset -1px 0 12px rgba(255,255,255,.08),
      8px 0 40px rgba(0,0,0,.35);
  }
  .device-inner{
    position:sticky;
    top:0;
    height:100vh;
    display:flex;
    flex-direction:column;
  }

  .watch-face{
    padding:28px 26px 20px;
    background:linear-gradient(160deg, rgba(255,255,255,.35), rgba(255,255,255,.05));
    border-bottom:1px solid rgba(255,255,255,.25);
  }
  .lcd{
    background:rgba(10,16,12,.55);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:6px;
    padding:14px 16px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.6);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .lcd .arrow{
    font-family:"Courier New",monospace;
    color:#5a6a5c;
    font-size:.85rem;
    user-select:none;
  }
  .lcd .time{
    font-family:"Courier New",monospace;
    font-weight:700;
    font-size:1.7rem;
    letter-spacing:.06em;
    color:var(--amber);
    text-shadow:0 0 8px rgba(242,169,60,.55);
  }
  .lcd-caption{
    margin-top:8px;
    font-family:"Courier New",monospace;
    font-size:.62rem;
    letter-spacing:.18em;
    color:#6a6f78;
    text-align:center;
  }

  nav.menu{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:0;
    overflow-y:auto;
  }
  .menu a{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-decoration:none;
    color:#eef0f4;
    font-weight:600;
    font-size:.92rem;
    letter-spacing:.03em;
    padding:20px 14px;
    text-align:center;
    background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.02) 55%, rgba(255,255,255,.1));
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border-top:1px solid rgba(255,255,255,.55);
    border-bottom:1px solid rgba(0,0,0,.18);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.6),
      inset 0 -8px 14px rgba(0,0,0,.12);
    text-shadow:0 1px 2px rgba(0,0,0,.35);
    clip-path:polygon(6% 0,100% 0,100% 100%,0 100%);
    overflow:hidden;
    transition:background .2s ease,color .2s ease,transform .2s ease;
  }
  .menu a::before{
    content:"";
    position:absolute;
    top:-40%;
    left:-20%;
    width:60%;
    height:220%;
    background:linear-gradient(115deg, rgba(255,255,255,.55), rgba(255,255,255,0) 55%);
    transform:rotate(8deg);
    pointer-events:none;
    opacity:.8;
  }
  .menu a:hover,.menu a:focus-visible{
    background:linear-gradient(180deg, rgba(242,169,60,.85), rgba(217,143,34,.65));
    color:#241705;
    text-shadow:none;
    transform:translateX(2px);
    outline:none;
  }
  .menu a.locked{color:#d7dae0;}
  .menu a.locked .lock{font-size:.8em;opacity:.85;}
  .menu a.locked:hover{color:#3c2e0d;}

  .device-foot{
    height:34px;
    background:linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.02));
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.25);
  }

  @media (max-width:760px){
    .stage{display:block;}
    .hero{position:relative;inset:auto;min-height:60vh;}
    .device{
      position:relative;
      width:100%;
      min-width:0;
      height:auto;
      border-right:none;
      border-bottom:1px solid rgba(255,255,255,.25);
    }
    .device-inner{height:auto;position:relative;}
    .menu{flex-direction:column;max-height:none;}
    .hero-copy{left:24px;right:24px;bottom:6vh;max-width:none;}
  }

  @media (prefers-reduced-motion: reduce){
    .strand{animation:none !important;}
  }
</style>
</head>
<body>

<div class="stage">

  <div class="device">
    <div class="device-inner">
      <div class="watch-face">
        <div class="lcd">
          <span class="arrow">◀</span>
          <span class="time" id="clock">00:00</span>
          <span class="arrow">▶</span>
        </div>
        <div class="lcd-caption">LOCAL TIME</div>
      </div>

      <nav class="menu" aria-label="Primary">
        <a href="#shop">SHOP</a>
        <a href="#shows">SHOWS</a>
        <a href="#music">MUSIC</a>
        <a href="#videos">VIDEOS</a>
        <a href="#instagram">INSTAGRAM</a>
        <a href="#livestream" class="locked"><span class="lock">🔒</span> LIVESTREAM</a>
        <a href="#photos" class="locked"><span class="lock">🔒</span> PHOTOS</a>
        <a href="#contact">CONTACT</a>
      </nav>

      <div class="device-foot"></div>
    </div>
  </div>

  <div class="hero">
    <video autoplay loop muted playsinline preload="auto" aria-hidden="true">
      <source src="https://www.image2url.com/r2/default/videos/1790374527367-032ad71c-94fc-4bdb-b080-a2396d5717e0.mp4" type="video/mp4">
    </video>
    <div class="scrim"></div>

    <div class="hero-copy">
      <p class="eyebrow">ARTIST&nbsp;&nbsp;·&nbsp;&nbsp;NEW ERA</p>
      <h1>Nocturne</h1>
      <p>Static in the air, low light on the skin — the new EP arrives on the shortest night of the year. Everything else on the dial is just the way in.</p>
      <a class="hero-cta" href="#music">Hear the first single</a>
    </div>
  </div>

</div>

<script>
  // live clock
  function tick(){
    const d=new Date();
    const h=String(d.getHours()).padStart(2,'0');
    const m=String(d.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = h+':'+m;
  }
  tick();
  setInterval(tick,1000*15);
</script>

</body>
</html>
